name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/assets

      - name: Prepare Web Assets
        run: |
          mkdir www
          cp index.html www/

      - name: Generate Native Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate App Icon & Splash Screen
        run: |
          mkdir assets
          # Copy your uploaded file and use it for both the Icon and Splash Screen
          cp file_000000008a0481f4952f0b961bdb651b.png assets/icon.png
          cp file_000000008a0481f4952f0b961bdb651b.png assets/splash.png
          # Run the Capacitor tool without the deprecated flag
          npx @capacitor/assets generate --android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradle Executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAIN-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
